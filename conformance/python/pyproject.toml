[project]
name = "dart-trackers-conformance"
version = "0.2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy==2.4.4",
  "scipy==1.17.1",
  "supervision==0.29.0",
  "trackers==2.6.0",
  "psutil==7.2.2",
]

[dependency-groups]
dev = [
  "pyrefly>=1.2.0",
  "pyright>=1.1.411",
  "pytest==9.0.3",
  "ruff>=0.16.4",
  "uv==0.12.5",
]

[tool.pyright]
include = ["."]
typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pyrefly]
project-includes = ["."]

[tool.pyrefly.errors]
unused-ignore = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
