[project]
name = "dart-trackers-conformance"
version = "0.2.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy==2.4.4",
  "scipy==1.17.1",
  "supervision==0.29.0",
  "trackers==2.6.0",
  "psutil==7.2.2",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "ruff>=0.16.4",
  "ty>=0.0.74",
  "uv==0.12.5",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
